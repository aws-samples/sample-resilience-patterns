name: "eks-multi-region: build"
on:
  push:
    paths:
      - eks-multi-region/**
    branches-ignore:
      - main
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    defaults:
      run:
        working-directory: eks-multi-region
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install cfn-lint (template lint gate)
        run: pip install cfn-lint==1.45.0
      - name: Install app deps (in-image smoke test)
        run: pip install -r src/app/requirements.txt
      - run: corepack enable && yarn install --immutable
      - name: CDK synth + cfn-lint + tests + asset staging
        env:
          CFN_LINT_REQUIRED: "1"
        run: yarn ci:build:cdk
