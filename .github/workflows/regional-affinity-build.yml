# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

name: "regional-affinity: build"
on:
  push:
    paths:
      - regional-affinity/**
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: regional-affinity
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx projen test
      - name: Python lint and unit tests
        run: pip install -q boto3 pytest ruff && ruff check . && python -m pytest -q
      - name: Synthesize every stack with cdk-nag
        run: npx cdk synth -c nag=true --quiet
