name: "regional-affinity: e2e"
on:
  pull_request:
    paths:
      - regional-affinity/**
      - "!regional-affinity/**.md"
      - "!regional-affinity/docs/**"
  workflow_dispatch: {}
jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: regional-affinity
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.E2E_ACCOUNT_ID }}:role/github-actions-regional-affinity
          aws-region: us-east-1
          role-duration-seconds: 7200
      - run: npm ci
      - run: npx projen test
      - name: Set sha-suffixed project name
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "PROJECT=regional-affinity-$(echo $HEAD_SHA | cut -c1-6)" >> $GITHUB_ENV
      - name: Pre-flight cleanup (idempotent)
        run: chmod +x cleanup.sh && ./cleanup.sh
      - name: Deploy
        run: make deploy
      - name: Drain and restore each Region
        run: make rehearse
      - name: Refresh AWS credentials (pre-cleanup)
        if: always()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.E2E_ACCOUNT_ID }}:role/github-actions-regional-affinity
          aws-region: us-east-1
          role-duration-seconds: 7200
      - name: Cleanup on success
        if: success()
        run: ./cleanup.sh
    timeout-minutes: 120
