# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

name: "drs-ec2: build"
on:
  push:
    paths:
      - drs-ec2/**
    branches-ignore:
      - main
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: drs-ec2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx projen test
      - name: Lambda unit tests
        run: pip install -q boto3 pytest ruff && (cd lambda && ruff check . && python -m pytest -q)
      - run: npx cdk synth --all
