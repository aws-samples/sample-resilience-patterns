name: "regional-affinity: cleanup"
on:
  workflow_dispatch:
    inputs:
      project:
        description: PROJECT prefix of the run to clean (the e2e uses regional-affinity-<first 6 characters of the commit>)
        required: false
        default: regional-affinity
        type: string
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: regional-affinity
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.E2E_ACCOUNT_ID }}:role/github-actions-regional-affinity
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Cleanup
        env:
          PROJECT: ${{ inputs.project || 'regional-affinity' }}
        run: chmod +x cleanup.sh && ./cleanup.sh
    timeout-minutes: 60
