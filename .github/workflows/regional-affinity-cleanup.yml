name: "regional-affinity: cleanup"
on:
  workflow_dispatch: {}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: regional-affinity
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.E2E_ACCOUNT_ID }}:role/github-actions-regional-affinity
          aws-region: us-east-1
      - run: chmod +x cleanup.sh && ./cleanup.sh
    timeout-minutes: 60
